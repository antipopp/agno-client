name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the version bumps
      pull-requests: write # to create the release PR
      id-token: write # for Trusted Publishing (provenance)

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      # This is the magic step
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This runs YOUR script when it's time to publish
          publish: pnpm ci:publish
          # The commit message for the version bump
          commit: "ci(release): version packages"
          title: "ci(release): version packages"
        env:
          # Necessary for the action to create PRs and push commits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Necessary for Trusted Publishing to authorize the upload
          NPM_CONFIG_PROVENANCE: true
